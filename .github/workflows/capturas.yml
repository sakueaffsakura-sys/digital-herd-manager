name: Capturas
# Sobe o site em modo de desenvolvimento, com o Supabase simulado (scripts/capturas/mock.mjs),
# e tira fotos das telas no computador e no celular, claro e escuro.
# As fotos e o relatorio.json vão para o ramo "capturas" (só a última execução).
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      cenas:
        description: "Cenas separadas por vírgula (vazio = todas)"
        required: false

permissions:
  contents: write

concurrency:
  group: capturas
  cancel-in-progress: false

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Instalar o navegador
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@^1.55.0 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: Subir o site
        run: |
          nohup bunx vite dev --host 127.0.0.1 --port 5173 > dev.log 2>&1 &
          for i in $(seq 1 90); do
            URL=$(grep -oE "http://(127\.0\.0\.1|localhost):[0-9]+" dev.log | head -1)
            if [ -n "$URL" ] && curl -sf "$URL/" > /dev/null; then break; fi
            sleep 2
          done
          echo "BASE_URL=$URL" >> "$GITHUB_ENV"
          curl -sf "$URL/" > /dev/null || (tail -80 dev.log; exit 1)
      - name: Fotos
        env:
          PW_DIR: /tmp/pw
          CENAS: ${{ github.event.inputs.cenas }}
        run: node scripts/capturas/capturar.mjs
      - name: Guardar no ramo capturas
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p capturas
          tail -200 dev.log > capturas/dev.log 2>/dev/null || true
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA}" > capturas/ORIGEM.txt
          cd capturas
          git init -q -b capturas
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Capturas de ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:capturas
